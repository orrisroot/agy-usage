[package]
name = "agy-usage"
version = "0.1.11"
edition = "2024"
authors = ["Yoshihiro OKUMURA <orrisroot@gmail.com>"]
description = "A CLI tool to track Antigravity model quota and usage"
license = "MIT"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
keyring = "3.6"
unicode-width = "0.2"
self_update = { version = "0.44", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls", "reqwest"] }
colored = "3.1.1"

