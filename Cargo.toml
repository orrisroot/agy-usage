[package]
name = "agy-usage"
version = "0.1.13"
edition = "2024"
authors = ["Yoshihiro OKUMURA <orrisroot@gmail.com>"]
description = "A CLI tool to track Antigravity model quota and usage"
license = "MIT"

[dependencies]
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
keyring = "4.2"
unicode-width = "0.2"
self_update = { version = "1.3", default-features = false, features = ["github", "progress-bar", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "rustls", "reqwest"] }
colored = "3.1.1"

